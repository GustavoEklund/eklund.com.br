# Continuous integration. Every check that can run unattended runs here; the same quick ones run on the developer's machine
# through the git hooks in .vite-hooks (pre-commit: staged files, commit-msg and pre-push: the commit convention, pre-push:
# `vp run verify`). The commit convention, the security scans and the release have workflows of their own.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # Mondays, 05:17 UTC: the slow suites and the filter-list check
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  VP_GIT_HOOKS: '0' # `vp install` runs the prepare script; hooks are for developers, not for the runner

jobs:
  quality:
    name: Format, lint, i18n audit and spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: vp check
      - run: vp run i18n
      - run: vp run proofread

  vitest:
    name: Unit, property, component, integration, contract and architecture tests, with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: vp run coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: reports/coverage
          if-no-files-found: ignore

  bdd:
    name: Behavior-driven scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: vp run test:bdd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cucumber-report
          path: reports/cucumber
          if-no-files-found: ignore

  e2e:
    name: End-to-end, accessibility and layout stability (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4'] # Playwright cuts the list in order, desktop tests first: two quarters of desktop, then two of mobile, about 15 minutes each instead of 29 for the whole desktop project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: vp exec playwright test --shard="$SHARD"
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: reports/playwright
          if-no-files-found: ignore

  standards:
    name: W3C validation, WCAG contrast sweep and CSS lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: java -version # the W3C Nu HTML Checker (vnu-jar) runs on the runner's JDK
      - run: vp run lint:css
      - run: vp run validate:html
      - run: vp run contrast

  build:
    name: Production build and its checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: vp run build
      - run: vp run test:build
      - run: java -version # the W3C Nu HTML Checker (vnu-jar) runs on the runner's JDK
      - run: node tools/validate-html.mjs --only-static dist/index.html
      - run: node tools/validate-html.mjs --only-static dist/en/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          include-hidden-files: true # the .htaccess files are part of the site
          if-no-files-found: error

  e2e-dist:
    name: End-to-end against the production build (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: vp run build
      - run: vp exec playwright test --shard="$SHARD"
        env:
          SITE_ROOT: dist # the whole end-to-end suite, against the build and not against source/
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-dist-${{ strategy.job-index }}
          path: reports/playwright
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse on the production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: vp run build
      # The action carries its own copy of Lighthouse CI, so the audit tool and its dependencies stay out of pnpm-lock.yaml.
      # It reads the pages, the number of runs and the server to start from lighthouserc.json.
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  mutation:
    name: Mutation testing (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: vp run test:mutation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore

  ad-blockers:
    name: Site against EasyList, EasyPrivacy and uBlock Origin lists (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      - run: vp run adblock

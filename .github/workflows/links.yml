# Links in the documentation. A pull request checks the links between files and their headings, which need no network. The
# weekly run also asks the web, because pages move and a link that worked last month may not work today.
name: Links

on:
  pull_request:
    paths:
      - '**.md'
      - .lychee.toml
      - .github/workflows/links.yml
  schedule:
    - cron: '47 7 * * 1' # Mondays, 07:47 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Check the links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --no-progress ${{ github.event_name == 'pull_request' && '--offline' || '' }} './**/*.md'
          fail: true

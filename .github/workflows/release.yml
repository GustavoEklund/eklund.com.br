# A release is a tag. Pushing vX.Y.Z checks the tag against package.json and CHANGELOG.md and that CI passed on the tagged
# commit, builds the site, and publishes a GitHub release with the zip of the site, its checksum, a software bill of materials
# and a signed provenance attestation for the zip, with the notes taken from CHANGELOG.md. Then the Deploy workflow puts the
# release online (docs/releasing.md, docs/build-and-deploy.md).
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CI: 'true'
  VP_GIT_HOOKS: '0'

jobs:
  verify:
    name: The tag, the version, the changelog and CI agree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # to ask which CI runs the tagged commit has
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node tools/changelog.mjs verify-release "$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          passed=$(gh run list --repo "$REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -lt 1 ]; then
            echo "::error::The CI workflow has no successful run for $GITHUB_SHA. Tag a commit of main after CI has passed on it."
            exit 1
          fi

  build:
    name: Build the site and package it
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: vp run build
      - run: vp run test:build
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          node tools/changelog.mjs notes "${TAG#v}" > release/notes.md
          # --strip-extra (-X) keeps the owner and the times of the runner out of the zip.
          # The manual of zip 3.0 calls it --no-extra, a name that zip itself rejects.
          (cd dist && zip --quiet --recurse-paths --strip-extra "../release/eklund.com.br-${TAG}.zip" .)
          (cd release && sha256sum "eklund.com.br-${TAG}.zip" > "eklund.com.br-${TAG}.zip.sha256")
          pnpm sbom --sbom-format cyclonedx --out "release/eklund.com.br-${TAG}.sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error

  publish:
    name: Attest and publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the release
      id-token: write # signs the attestation
      attestations: write # stores it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--verify-tag --title "$TAG" --notes-file release/notes.md)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/eklund.com.br-* --repo "$REPOSITORY" "${flags[@]}"

  deploy:
    name: Put the release online
    needs: publish
    permissions:
      contents: read # downloads the release
      attestations: read # verifies its provenance
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    # The FTP account, which the job of Deploy reads from the production environment. Passed by name, so Deploy gets these
    # three and no other secret.
    secrets:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

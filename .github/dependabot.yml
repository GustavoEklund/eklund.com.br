# Dependency updates. Every update is a pull request that has to pass the same CI as any other change, and none arrives
# until its version has been public for a while (a compromised release is usually pulled within days). Security updates
# ignore the cool-down, as GitHub intends: see docs/continuous-integration.md for what to do when one arrives too young
# for the two-day rule in pnpm-workspace.yaml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci(deps)'
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps)'
    labels:
      - dependencies
      - javascript
    groups:
      tooling:
        patterns: ['*']

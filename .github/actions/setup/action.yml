name: Set up the project
description: Vite+ with Node 24 and the pnpm store cache, and optionally the Playwright browser. Run it after actions/checkout.

inputs:
  browser:
    description: Install the Playwright Chromium browser, which the browser tests need
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
      with:
        node-version: '24'
        cache: true
    - if: inputs.browser == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - if: inputs.browser == 'true'
      shell: bash
      run: vp exec playwright install --with-deps chromium
